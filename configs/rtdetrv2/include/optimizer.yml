# 新增
optimizer:
  type: AdamW
  params:
    # Encoder adapters / pyramid convs (exclude encoder.vit)
    -
      params: '^(?=.*encoder)(?!.*encoder\\.vit)(?!.*(?:norm|bn)).*$'
      lr: 0.00008
    -
      params: '^(?=.*encoder)(?!.*encoder\\.vit)(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

    # Decoder
    -
      params: '^(?=.*decoder)(?!.*(?:norm|bn)).*$'
      lr: 0.00008
    -
      params: '^(?=.*decoder)(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.00008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# Match longer training horizon
lr_scheduler:
  type: MultiStepLR
  milestones: [95, 105]
  gamma: 0.1

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 800